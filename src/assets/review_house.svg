<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="Home">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3f2"/>
      <stop offset="1" stop-color="#eaf2f8"/>
    </linearGradient>
  </defs>
  <rect width="80" height="80" fill="url(#sky)"/>
  <!-- lawn / driveway -->
  <rect y="60" width="80" height="20" fill="#8bab68"/>
  <path d="M30 80 L36 60 H50 L56 80 Z" fill="#c9cdd2"/>
  <!-- roof -->
  <path d="M8 40 L40 16 L72 40 Z" fill="#4a4f57"/>
  <path d="M40 16 L72 40 H64 L40 22 Z" fill="#3c414a"/>
  <!-- house body -->
  <rect x="16" y="38" width="48" height="26" fill="#d8c3a5"/>
  <rect x="16" y="38" width="48" height="26" fill="none" stroke="#c3ac8a" stroke-width="1"/>
  <!-- upper windows -->
  <rect x="22" y="42" width="9" height="8" fill="#7fb0d6" stroke="#fff" stroke-width="1"/>
  <rect x="35" y="42" width="9" height="8" fill="#7fb0d6" stroke="#fff" stroke-width="1"/>
  <rect x="48" y="42" width="9" height="8" fill="#7fb0d6" stroke="#fff" stroke-width="1"/>
  <!-- door -->
  <rect x="36" y="52" width="9" height="12" fill="#6b4b34"/>
  <!-- garage -->
  <rect x="20" y="53" width="12" height="11" fill="#efe7da" stroke="#c3ac8a" stroke-width="1"/>
  <!-- lower window -->
  <rect x="49" y="53" width="9" height="8" fill="#7fb0d6" stroke="#fff" stroke-width="1"/>
</svg>
